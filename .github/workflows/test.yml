# Lint + the full test suite against a real knowledge base. Reused by CI, Release and the nightly KB refresh,
# so nothing reaches players untested: CI and pull requests check the KB players have now (the latest
# release's kb.zip), Release and KB refresh pass the exact KB they are about to publish.
name: Test

on:
  workflow_call:
    inputs:
      kb-artifact:
        description: "Artifact holding the kb.zip to test (empty: the latest release's kb.zip)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  per-os:
    # both shipped platforms: tests/test_bidi.py measures real glyph positions from each OS's Qt
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # uv installs the same wheels into the same interpreter as pip, several times faster
      - uses: astral-sh/setup-uv@v10.2.0   # this action publishes exact tags only, no floating v10
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check . --output-format=github

      # data/kb is not in git: without it every game-value test (drops, EXP, quests, guides) would be skipped
      - name: Get the knowledge base to test (artifact)
        if: inputs.kb-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.kb-artifact }}
          path: kb-in

      - name: Get the knowledge base to test (latest release)
        if: inputs.kb-artifact == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern kb.zip --dir kb-in

      - name: Unpack the knowledge base
        run: python -m zipfile -e kb-in/kb.zip data/kb

      # one worker per core (pytest-xdist): each worker is its own process with its own throwaway APPDATA/HOME
      # (tests/conftest.py), so tests can't see each other's files
      - name: Test
        env:
          MAPLEHELPER_REQUIRE_REAL_KB: "1"    # a test that needs data/kb fails instead of skipping
        run: python -m pytest -n auto --junitxml=test-results.xml -o junit_family=xunit2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results.xml
          retention-days: 14

  # the check name branch protection requires ("test / Lint & test"): green only when every OS is green
  all:
    name: Lint & test
    needs: per-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every OS passed
        run: |
          echo "per-OS result: ${{ needs.per-os.result }}"
          [ "${{ needs.per-os.result }}" = success ]
