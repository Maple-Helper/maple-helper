name: Update knowledge base

# Nightly: fetch the NiaDB pages that changed (sitemap lastmod), new pages, and the 400 fetched longest ago (the
# whole site over ~18 nights, for edits the sitemap doesn't date). The site's tool rules (meowdb.com/reuse#tool-rules)
# allow one request every 10 seconds, one at a time, and a stop on a 403/429; tools/scrape_meowdb.py's fetch enforces
# them, so there is no full refresh in one night any more (7,161 pages would take ~20 hours).
# Publishes kb.zip + kb-manifest.json to the latest release only when content actually changed and the full
# test suite passes against the new KB (tools/nightly_gate.py: a few data tests the site's edits changed don't block,
# they go to a "kb-drift" issue); every installed Maple Helper picks it up on its next start.
on:
  schedule:
    # off the hour: GitHub queues runs at :00 behind everyone else's (01:00 runs started 5-6 hours late)
    - cron: "23 0 * * *"         # 00:23 UTC = 03:23 Israel in summer, 02:23 in winter
  workflow_dispatch:
    inputs:
      full:
        description: "Re-read 1,200 more pages tonight (~3.5 hours at the site's pace) instead of the usual 400"
        type: boolean
        default: false
      translate_all:
        description: "Translate every text still in English tonight (no 120-text ceiling; up to 150 minutes)"
        type: boolean
        default: false

permissions:
  contents: write

# two nights (or a Run workflow during the nightly) never scrape at the same time
concurrency:
  group: kb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moves to 26 from Oct 19, 2026; move once the nightly is tried there
    # ~70 minutes of rolling pages and ~70 of community reports at 10 s a request, plus translation
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen      # the scraper's browser engine (tools/browser_fetch.py) has no screen here
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      translate: ${{ steps.translate.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"     # the same Python as the app, the tests and the builds

      # the scraper turns every picture into a PNG with Pillow: without it no new picture was ever saved
      - name: Install Pillow
        run: python -m pip install "pillow>=12.3.0"

      # since 2026-11-10 meowdb.com answers only browsers: the scraper asks from inside a page of the site with Qt
      # WebEngine (tools/browser_fetch.py, --browser below), which needs these libraries on the runner
      - name: Install Qt WebEngine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 libxtst6 libdbus-1-3 libfontconfig1 libxshmfence1 libasound2t64 libgbm1 libxkbfile1 >/dev/null
          python -m pip install "$(grep -m1 '^PySide6==' requirements.txt | cut -d' ' -f1)"

      - name: Find the latest release
        id: rel
        run: |
          # a routine starts the night by hand at 00:30 UTC (GitHub queues the cron for hours); the late cron run
          # then finds tonight's run done and asks meowdb.com nothing: one night's requests a day, not two
          since=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow kb-update.yml --event workflow_dispatch \
            --created ">$since" --json databaseId,conclusion \
            -q "[.[] | select(.databaseId != ${{ github.run_id }} and .conclusion != \"cancelled\")] | length")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${others:-0}" -gt 0 ]; then
            echo "Tonight's run was started by hand already - nothing to do."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet - nothing to update."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the published knowledge base
        if: steps.rel.outputs.exists == 'true'
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern kb.zip --dir /tmp
          mkdir -p data/kb
          unzip -q /tmp/kb.zip -d data/kb
          cp data/kb/index.json /tmp/prev-index.json

      # a 403/429 from meowdb.com stops every request to it (the site's rules): the KB we have stays, Nexon's news
      # still come, and the steps below that ask meowdb.com are skipped tonight
      - name: Fetch changes from NiaDB
        id: fetch
        if: steps.rel.outputs.exists == 'true'
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then rolling=1200; else rolling=400; fi
          python tools/scrape_meowdb.py --browser --changed --rolling "$rolling"
          cat data/kb/last_run.json
          blocked=$(python -c 'import json; print(json.load(open("data/kb/last_run.json")).get("blocked") or "")')
          if [ -n "$blocked" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::meowdb.com refused us ($blocked): nothing more asked of it tonight; the published KB stays"
            echo "### meowdb.com refused tonight's requests: $blocked" >> "$GITHUB_STEP_SUMMARY"
          fi

      # the drops and mesos players report per monster (community.json): MeowDB's monster pages load them in the
      # browser, so the page scrape above never sees them. Every night, all monsters (~70 min at the site's pace);
      # their changes add to last_run.json's "changed". If the site doesn't answer, the published copy stays (a
      # warning, not a failure).
      - name: Fetch players' drop and mesos reports
        if: steps.rel.outputs.exists == 'true' && steps.fetch.outputs.blocked != 'true'
        run: |
          python tools/scrape_meowdb.py --browser --community || echo "::warning::community reports not updated tonight"
          cat data/kb/last_run.json

      # pictures the pages above didn't bring (an NPC's portrait, a map's minimap): only the ones still missing, so
      # most nights this is a quick check. If the site doesn't answer, the night still publishes (a warning).
      - name: Fill missing pictures
        if: steps.rel.outputs.exists == 'true' && steps.fetch.outputs.blocked != 'true'
        run: |
          python tools/scrape_meowdb.py --browser --images || echo "::warning::pictures not filled tonight"

      # Hebrew for what came in English tonight (a new quest's journal line, a pet skill, a skill note, a news item):
      # into the KB's own he.json, so it reads in Hebrew from tomorrow with no app release. A capped number of texts
      # a night; no key, a bad key or the API down only warns.
      # (translate_kb itself warns and exits 0 on API trouble: a non-zero exit is a bug, reported in the kb-drift issue)
      - name: Translate what's new into Hebrew
        id: translate
        if: steps.rel.outputs.exists == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MAX_TEXTS: ${{ inputs.translate_all && '100000' || '' }}
          TRANSLATE_BUDGET_MIN: ${{ inputs.translate_all && '150' || '' }}
        run: |
          if ! python tools/translate_kb.py data/kb; then
            echo "::error::the Hebrew translation crashed tonight (a bug, not the API)"
            echo "result=crashed" >> "$GITHUB_OUTPUT"
          fi

      # a broken scrape (site down, layout change) must never reach players: this fails the run instead
      - name: Validate before publishing
        if: steps.rel.outputs.exists == 'true'
        run: python tools/kb_release.py validate data/kb --previous /tmp/prev-index.json --min-entities 500

      - name: Anything changed?
        id: changed
        if: steps.rel.outputs.exists == 'true'
        run: |
          changed=$(python -c "import json;print(json.load(open('data/kb/last_run.json'))['changed'])")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" -gt 0 ]; then echo "$changed pages changed"; else echo "No content changes."; fi

      # nothing new tonight: the published knowledge base stays, but its manifest says it was checked today, so
      # every app shows "knowledge base verified" with tonight's date (kb.zip and its checksum are untouched)
      - name: Stamp tonight's check
        if: steps.rel.outputs.exists == 'true' && steps.changed.outputs.changed == 0
        run: |
          # one release read and stamped: a release published meanwhile (Release doesn't wait for this job) keeps its own
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern kb-manifest.json --dir /tmp/stamp
          python -c "import json,os,time;p='/tmp/stamp/kb-manifest.json';m=json.load(open(p));m['checked']=time.strftime('%Y-%m-%d',time.gmtime());m['url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/latest/download/kb.zip';json.dump(m,open(p,'w'))"
          gh release upload "$tag" /tmp/stamp/kb-manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      # the candidate goes to the tests first: a scrape with a valid shape but wrong game values stops there
      - name: Pack the candidate
        if: steps.changed.outputs.changed > 0
        run: |
          mkdir -p kb-candidate
          (cd data/kb && zip -qr "$GITHUB_WORKSPACE/kb-candidate/kb.zip" .)

      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.changed > 0
        with:
          name: kb-candidate
          path: kb-candidate/kb.zip
          retention-days: 7

  test:
    needs: update
    if: needs.update.outputs.changed > 0
    uses: ./.github/workflows/test.yml
    with:
      kb-artifact: kb-candidate
      nightly-gate: true

  # what the gate let through (data tests the new KB changed) or why it stopped: one open issue, updated each night,
  # so nobody has to read the run to know a test needs a look
  report:
    name: Report data changes
    needs: [update, test]
    if: always() && (needs.update.outputs.changed > 0 || needs.update.outputs.translate == 'crashed')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        continue-on-error: true     # no report at all (the job died first) is reported below
        with:
          pattern: gate-report-*
          merge-multiple: true
          path: reports

      - name: Open or update the issue
        run: |
          python tools/nightly_gate.py --issue-body reports --test-result "${{ needs.test.result }}"             --translate "${{ needs.update.outputs.translate }}" > body.md || {
            echo "Nothing to report."; exit 0; }
          gh label create kb-drift --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Nightly KB: data tests to review" 2>/dev/null || true
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label kb-drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label kb-drift --title "Nightly KB: needs a look" --body-file body.md
          fi

  publish:
    name: Publish the new knowledge base
    needs: [update, test]
    if: needs.update.outputs.changed > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # shared with release.yml's publish: the two never modify release assets at the same time
    concurrency:
      group: release-assets
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: kb-candidate
          path: kb-in

      - name: Publish
        run: |
          mkdir -p data/kb
          unzip -q kb-in/kb.zip -d data/kb
          python tools/release.py --kb-only
