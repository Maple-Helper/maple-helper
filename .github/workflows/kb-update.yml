name: Update knowledge base

# Nightly: fetch only the NiaMeowDB pages that changed (sitemap lastmod) plus new pages.
# Sundays: full refresh, to catch edits the sitemap doesn't date.
# Publishes kb.zip + kb-manifest.json to the latest release only when content actually changed and the full
# test suite passes against the new KB; every installed Maple Helper picks it up on its next start.
on:
  schedule:
    # off the hour: GitHub queues runs at :00 behind everyone else's (01:00 runs started 5-6 hours late)
    - cron: "23 0 * * *"         # 00:23 UTC = 03:23 Israel in summer, 02:23 in winter (still the same UTC day, for the Sunday check)
  workflow_dispatch:
    inputs:
      full:
        description: "Full refresh (re-download every page)"
        type: boolean
        default: false

permissions:
  contents: write

# two nights (or a Run workflow during the nightly) never scrape at the same time
concurrency:
  group: kb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moves to 26 from Oct 19, 2026; move once the nightly is tried there
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"     # the same Python as the app, the tests and the builds

      # the scraper turns every picture into a PNG with Pillow: without it no new picture was ever saved
      - name: Install Pillow
        run: python -m pip install "pillow>=12.3.0"

      - name: Find the latest release
        id: rel
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet - nothing to update."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the published knowledge base
        if: steps.rel.outputs.exists == 'true'
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern kb.zip --dir /tmp
          mkdir -p data/kb
          unzip -q /tmp/kb.zip -d data/kb
          cp data/kb/index.json /tmp/prev-index.json

      - name: Fetch changes from NiaMeowDB
        if: steps.rel.outputs.exists == 'true'
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python tools/scrape_meowdb.py --refresh
          else
            python tools/scrape_meowdb.py --changed
          fi
          cat data/kb/last_run.json

      # the drops and mesos players report per monster (community.json): MeowDB's monster pages load them in the
      # browser, so the page scrape above never sees them. Every night, all monsters (~6 min); their changes add to
      # last_run.json's "changed". If the site doesn't answer, the published copy stays (a warning, not a failure).
      - name: Fetch players' drop and mesos reports
        if: steps.rel.outputs.exists == 'true'
        run: |
          python tools/scrape_meowdb.py --community || echo "::warning::community reports not updated tonight"
          cat data/kb/last_run.json

      # pictures the pages above didn't bring (an NPC's portrait, a map's minimap): only the ones still missing, so
      # most nights this is a quick check. If the site doesn't answer, the night still publishes (a warning).
      - name: Fill missing pictures
        if: steps.rel.outputs.exists == 'true'
        run: |
          python tools/scrape_meowdb.py --images || echo "::warning::pictures not filled tonight"

      # Hebrew for what came in English tonight (a new quest's journal line, a pet skill, a skill note, a news item):
      # into the KB's own he.json, so it reads in Hebrew from tomorrow with no app release. A capped number of texts
      # a night; no key, a bad key or the API down only warns.
      - name: Translate what's new into Hebrew
        if: steps.rel.outputs.exists == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tools/translate_kb.py data/kb || echo "::warning::translations not made tonight"

      # a broken scrape (site down, layout change) must never reach players: this fails the run instead
      - name: Validate before publishing
        if: steps.rel.outputs.exists == 'true'
        run: python tools/kb_release.py validate data/kb --previous /tmp/prev-index.json --min-entities 500

      - name: Anything changed?
        id: changed
        if: steps.rel.outputs.exists == 'true'
        run: |
          changed=$(python -c "import json;print(json.load(open('data/kb/last_run.json'))['changed'])")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" -gt 0 ]; then echo "$changed pages changed"; else echo "No content changes."; fi

      # nothing new tonight: the published knowledge base stays, but its manifest says it was checked today, so
      # every app shows "knowledge base verified" with tonight's date (kb.zip and its checksum are untouched)
      - name: Stamp tonight's check
        if: steps.rel.outputs.exists == 'true' && steps.changed.outputs.changed == 0
        run: |
          # one release read and stamped: a release published meanwhile (Release doesn't wait for this job) keeps its own
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern kb-manifest.json --dir /tmp/stamp
          python -c "import json,os,time;p='/tmp/stamp/kb-manifest.json';m=json.load(open(p));m['checked']=time.strftime('%Y-%m-%d',time.gmtime());m['url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/latest/download/kb.zip';json.dump(m,open(p,'w'))"
          gh release upload "$tag" /tmp/stamp/kb-manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      # the candidate goes to the tests first: a scrape with a valid shape but wrong game values stops there
      - name: Pack the candidate
        if: steps.changed.outputs.changed > 0
        run: |
          mkdir -p kb-candidate
          (cd data/kb && zip -qr "$GITHUB_WORKSPACE/kb-candidate/kb.zip" .)

      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.changed > 0
        with:
          name: kb-candidate
          path: kb-candidate/kb.zip
          retention-days: 7

  test:
    needs: update
    if: needs.update.outputs.changed > 0
    uses: ./.github/workflows/test.yml
    with:
      kb-artifact: kb-candidate

  publish:
    name: Publish the new knowledge base
    needs: [update, test]
    if: needs.update.outputs.changed > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # shared with release.yml's publish: the two never modify release assets at the same time
    concurrency:
      group: release-assets
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: kb-candidate
          path: kb-in

      - name: Publish
        run: |
          mkdir -p data/kb
          unzip -q kb-in/kb.zip -d data/kb
          python tools/release.py --kb-only
