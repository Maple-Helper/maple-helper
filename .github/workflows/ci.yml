# Every push to main and every pull request: tests on Windows and macOS, and alongside them a full Windows build
# (frozen exe self-test, portable zip, installer round trip). The macOS build (.app self-test, DMG round trip) runs
# on pushes to main only: it isn't a required check, and Release builds and tests the DMG again before publishing.
# Nothing is published, so the builds don't wait for the tests: the run is green only when all of them pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build & smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Defender scans every file a runner reads or writes: the frozen build's DLL scan took 5 s in one run and 184 s
      # in the next, and dependency installs swing the same way. Throwaway VM, pinned dependencies: nothing to guard
      - name: Turn off Defender real-time scanning
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Warning "$_" }
          Write-Host "Real-time protection on: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # uv installs the same wheels into the same interpreter as pip, several times faster
      - uses: astral-sh/setup-uv@v10.2.0   # this action publishes exact tags only, no floating v10
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: ./packaging/install-inno.ps1

      # CI proves the packaging works; the fixture KB and lighter installer compression keep it fast.
      # Releases bundle the real KB and compress fully.
      - name: Build, self-test, installer round trip
        shell: pwsh
        env:
          PYTHON: python
        run: ./packaging/build.ps1 -KbDir tests/fixtures/kb -RequireKb -TestInstaller -FastInstaller

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: maplehelper-ci-${{ github.sha }}
          path: dist/release/*
          retention-days: 14

  build-macos:
    name: Build & smoke test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # uv installs the same wheels into the same interpreter as pip, several times faster
      - uses: astral-sh/setup-uv@v10.2.0   # this action publishes exact tags only, no floating v10
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Build, self-test, DMG round trip
        env:
          PYTHON: python
        run: ./packaging/build-macos.sh --kb-dir tests/fixtures/kb --require-kb --test-dmg

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: maplehelper-ci-macos-${{ github.sha }}
          path: dist/release/*
          retention-days: 14
